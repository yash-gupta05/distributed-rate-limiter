spring.application.name=distributed-rate-limiter

# Redis shard endpoints (comma-separated host:port pairs)
ratelimiter.redis-shards=localhost:6379,localhost:6380,localhost:6381,localhost:6382

# Server port
server.port=8080

# Rate limiter configuration
ratelimiter.capacity=10
ratelimiter.refill-rate=2.0

# Fault tolerance behavior when Redis is unreachable
# true = allow requests through (fail-open), false = reject requests (fail-closed)
ratelimiter.fail-open=true

# Comma-separated list of resolved client identities treated as premium.
# Format matches ClientIdentifier's output: "apikey:xxx", "client:xxx", or "ip:xxx"
ratelimiter.premium-clients=apikey:premium-key-123

# Expose actuator endpoints (health + metrics) over HTTP
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=false