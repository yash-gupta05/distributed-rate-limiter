services:
  redis-shard-0:
    image: redis:7-alpine
    container_name: redis-shard-0
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - ratelimiter-net

  redis-shard-1:
    image: redis:7-alpine
    container_name: redis-shard-1
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - ratelimiter-net

  redis-shard-2:
    image: redis:7-alpine
    container_name: redis-shard-2
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - ratelimiter-net

  redis-shard-3:
    image: redis:7-alpine
    container_name: redis-shard-3
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - ratelimiter-net

  rate-limiter-app:
    build: .
    container_name: rate-limiter-app
    ports:
      - "8080:8080"
    environment:
      - RATELIMITER_REDIS_SHARDS=redis-shard-0:6379,redis-shard-1:6379,redis-shard-2:6379,redis-shard-3:6379
    depends_on:
      redis-shard-0:
        condition: service_healthy
      redis-shard-1:
        condition: service_healthy
      redis-shard-2:
        condition: service_healthy
      redis-shard-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - ratelimiter-net

networks:
  ratelimiter-net:
    driver: bridge